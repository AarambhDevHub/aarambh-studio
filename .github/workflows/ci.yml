name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
      - run: cargo check --workspace --all-targets --locked

  quality:
    name: Stable quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Test
        run: cargo test --workspace --no-fail-fast --locked

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --workspace --no-deps --locked

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Release audit
        run: scripts/phase28_release_audit.sh

      - name: Shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Build release
        run: cargo build --release -p aarambh-studio --locked

      - name: CLI smoke
        run: |
          target/release/aarambh-studio --version
          target/release/aarambh-studio --help
          target/release/aarambh-studio train --help
          target/release/aarambh-studio infer --help
          target/release/aarambh-studio agent --help
          target/release/aarambh-studio eval --help
          target/release/aarambh-studio eval --redteam --help
          target/release/aarambh-studio eval --generate-model-card --help
          target/release/aarambh-studio quantise --help
          target/release/aarambh-studio convert --help
          target/release/aarambh-studio serve --help
          target/release/aarambh-studio finetune --help
          target/release/aarambh-studio finetune sft --help
          target/release/aarambh-studio finetune qlora --help
          target/release/aarambh-studio finetune tool-sft --help
          target/release/aarambh-studio finetune tool-qlora --help
          target/release/aarambh-studio finetune dora --help
          target/release/aarambh-studio finetune qdora --help
          target/release/aarambh-studio finetune vlm-dora --help
          target/release/aarambh-studio finetune vlm-qdora --help
          target/release/aarambh-studio finetune grpo --help
          target/release/aarambh-studio finetune dpo --help
          target/release/aarambh-studio finetune qdpo --help
          target/release/aarambh-studio finetune rlaif --help
          target/release/aarambh-studio finetune merge --help
          target/release/aarambh-studio merge --help
          target/release/aarambh-studio merge linear --help
          target/release/aarambh-studio merge slerp --help
          target/release/aarambh-studio merge task-arithmetic --help
          target/release/aarambh-studio merge ties --help
          target/release/aarambh-studio merge dare --help
          target/release/aarambh-studio distill --help
          target/release/aarambh-studio distill train --help
          target/release/aarambh-studio distill evaluate --help
          target/release/aarambh-studio selflearn --help
          target/release/aarambh-studio selflearn start --help
          target/release/aarambh-studio selflearn flush-gradients --help
          target/release/aarambh-studio selflearn replay --help
          target/release/aarambh-studio selflearn stats --help
          target/release/aarambh-studio selflearn reset --help

  security-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
