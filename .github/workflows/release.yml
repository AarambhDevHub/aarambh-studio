name: Release

on:
  push:
    tags:
      - v4.0.0

permissions:
  contents: write
  checks: write
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Validate and release v4.0.0 source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Verify release tag
        run: test "${GITHUB_REF_NAME}" = "v4.0.0"

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Test
        run: cargo test --workspace --no-fail-fast --locked

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --workspace --no-deps --locked

      - name: Release audit
        run: scripts/phase28_release_audit.sh

      - name: Build release binary
        run: cargo build --release -p aarambh-studio --locked

      - name: Verify CLI
        run: |
          test "$(target/release/aarambh-studio --version)" = "aarambh-studio 4.0.0"
          target/release/aarambh-studio --version
          target/release/aarambh-studio --help
          target/release/aarambh-studio train --help
          target/release/aarambh-studio infer --help
          target/release/aarambh-studio agent --help
          target/release/aarambh-studio eval --help
          target/release/aarambh-studio eval --redteam --help
          target/release/aarambh-studio eval --generate-model-card --help
          target/release/aarambh-studio quantise --help
          target/release/aarambh-studio convert --help
          target/release/aarambh-studio finetune --help
          target/release/aarambh-studio distill --help
          target/release/aarambh-studio selflearn --help
          target/release/aarambh-studio serve --help
          target/release/aarambh-studio merge --help

      - name: Dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: aarambh-studio v4.0.0
          body_path: .github/release-notes/v4.0.0.md
          generate_release_notes: true
          make_latest: true
